<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; font-family: "JetBrains Mono", monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
const q = new URLSearchParams(location.search);
const W = Number(q.get("w") ?? 2560);
const H = Number(q.get("h") ?? 1440);
const SEC = Number(q.get("sec") ?? 3);
const FPS = Number(q.get("fps") ?? 30);
const COLS = Number(q.get("cols") ?? 160);
const SEED = Number(q.get("seed") ?? 7);
const SETTLE = Number(q.get("settle") ?? 10);
const AGENTS = Number(q.get("agents") ?? 9000);

const log = (m) => fetch("/log", { method: "POST", body: m });
const canvas = document.getElementById("c");
try { Object.defineProperty(window, "devicePixelRatio", { get: () => 1 }); } catch {}
canvas.style.width = W + "px";
canvas.style.height = H + "px";
await document.fonts.load('400 16px "JetBrains Mono"');
await document.fonts.ready;

// ---- seeded rng -------------------------------------------------------
let s = SEED >>> 0 || 1;
const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);

// ---- grid -------------------------------------------------------------
const cw = W / COLS;
const ch = Math.round(cw * 1.45);
const rows = Math.floor(H / ch);
const simW = COLS * 2, simH = rows * 2;       // simulate at 2x, fold down to glyphs
const N = simW * simH;

const trail = new Float32Array(N);
const next = new Float32Array(N);

// ---- agents -----------------------------------------------------------
const ax = new Float32Array(AGENTS), ay = new Float32Array(AGENTS), ah = new Float32Array(AGENTS);
const seedAgents = () => {
  for (let i = 0; i < AGENTS; i++) {
    // a handful of loose clumps: structure emerges fast, then wanders
    const k = i % 7;
    const cx = (0.12 + 0.13 * k) * simW + (rnd() - 0.5) * simW * 0.12;
    const cy = (0.25 + 0.5 * ((k * 0.37) % 1)) * simH + (rnd() - 0.5) * simH * 0.2;
    ax[i] = Math.min(simW - 1, Math.max(0, cx));
    ay[i] = Math.min(simH - 1, Math.max(0, cy));
    ah[i] = rnd() * Math.PI * 2;
  }
};
seedAgents();

const SENSOR_ANGLE = 0.42, SENSOR_DIST = 5.5, TURN = 0.50, SPEED = 0.9, DEPOSIT = 1;

const at = (x, y) => trail[((y | 0) % simH + simH) % simH * simW + ((x | 0) % simW + simW) % simW];

function stepSim() {
  for (let i = 0; i < AGENTS; i++) {
    let x = ax[i], y = ay[i], h = ah[i];
    const sense = (a) => {
      const sx = x + Math.cos(h + a) * SENSOR_DIST;
      const sy = y + Math.sin(h + a) * SENSOR_DIST;
      return at(sx, sy);
    };
    const l = sense(-SENSOR_ANGLE), c = sense(0), r = sense(SENSOR_ANGLE);
    if (c > l && c > r) { /* straight */ }
    else if (c < l && c < r) h += (rnd() < 0.5 ? -1 : 1) * TURN;
    else if (l > r) h -= TURN;
    else h += TURN;
    x += Math.cos(h) * SPEED;
    y += Math.sin(h) * SPEED;
    if (x < 0) x += simW; else if (x >= simW) x -= simW;
    if (y < 0) y += simH; else if (y >= simH) y -= simH;
    ax[i] = x; ay[i] = y; ah[i] = h;
    const j = (y | 0) * simW + (x | 0);
    trail[j] = Math.min(60, trail[j] + DEPOSIT);
  }
  // blur + decay, separable-free 3x3 box (cheap, wraps at edges)
  for (let y = 0; y < simH; y++) {
    const row = y * simW;
    for (let x = 0; x < simW; x++) {
      let v = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = (y + dy + simH) % simH;
        for (let dx = -1; dx <= 1; dx++) v += trail[yy * simW + ((x + dx + simW) % simW)];
      }
      next[row + x] = v / 9 * 0.93;
    }
  }
  trail.set(next);
}

// ---- render -----------------------------------------------------------
const ctx = canvas.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = Math.round(W * dpr);
canvas.height = Math.round(H * dpr);
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.font = `400 ${Math.round(ch * 0.92)}px "JetBrains Mono", monospace`;

const RAMP = " .,:;+*x#%@";
const LO = [26, 54, 72], HI = [168, 240, 235];

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let max = 1;
  for (let i = 0; i < N; i++) if (trail[i] > max) max = trail[i];
  const inv = 1 / max;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < COLS; c++) {
      // fold the 2x2 sim block to one glyph: max keeps single-cell filaments
      const x0 = c * 2, y0 = r * 2;
      const a = trail[y0 * simW + x0], b = trail[y0 * simW + x0 + 1];
      const d = trail[(y0 + 1) * simW + x0], e = trail[(y0 + 1) * simW + x0 + 1];
      const v = (Math.max(a, b, d, e) * 0.75 + (a + b + d + e) * 0.0625) * inv;
      const t = Math.min(1, Math.pow(v, 0.62));
      if (t < 0.06) continue;
      const g = RAMP[Math.min(RAMP.length - 1, Math.floor(t * RAMP.length))];
      const col = `rgb(${LO[0] + (HI[0] - LO[0]) * t | 0},${LO[1] + (HI[1] - LO[1]) * t | 0},${LO[2] + (HI[2] - LO[2]) * t | 0})`;
      ctx.fillStyle = col;
      ctx.fillText(g, c * cw + cw / 2, r * ch + ch / 2 + 1);
    }
  }
}

const STEP = 1 / 60;
for (let t = 0; t < SETTLE; t += STEP) stepSim();
log(`grid ${COLS}x${rows} cell ${cw.toFixed(1)}x${ch} sim ${simW}x${simH} agents ${AGENTS} dpr ${dpr}`);

const frames = Math.max(1, Math.round(SEC * FPS));
const per = Math.round(60 / FPS);
const t0 = performance.now();
for (let f = 0; f < frames; f++) {
  for (let k = 0; k < per; k++) stepSim();
  render();
  const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
  await fetch("/frame?i=" + f, { method: "POST", body: blob });
}
log(`rendered ${frames} frames in ${(performance.now() - t0).toFixed(0)}ms`);
fetch("/done");
</script>
</body>
</html>
