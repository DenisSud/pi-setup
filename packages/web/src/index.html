<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bots</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/blobatar-motion.css">
<link rel="stylesheet" href="/blobatar-gaze.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div id="scrim"></div>
  <aside id="sidebar">
    <h1>bots <span class="side-actions">
      <button id="refresh" title="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button id="sidebar-close" title="close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </span></h1>
    <ul id="bot-list"></ul>
  </aside>
  <main id="main">
    <header id="session-bar">
      <button id="menu" title="bot list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></button>
      <span id="session-title">no session</span>
      <span id="session-status"></span>
      <span id="session-actions">
        <button id="stop" title="abort the running turn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>stop</button>
        <button id="compact" title="compact the session history" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-6"/><path d="M12 8V2"/><path d="M4 12H2"/><path d="M10 12H8"/><path d="M16 12h-2"/><path d="M22 12h-2"/><path d="m15 19-3-3-3 3"/><path d="m15 5-3 3-3-3"/></svg>compact</button>
        <button id="new" title="start a new session" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>new</button>
      </span>
    </header>
    <section id="transcript"></section>
    <form id="prompt-form">
      <button id="latest" title="jump to the latest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>latest<span class="jump-ring" id="latest-spin" hidden></span>
      </button>
      <div class="composer" id="composer">
        <button id="composer-toggle" class="composer-toggle" type="button" title="expand input" aria-label="expand input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <textarea id="prompt" rows="1" placeholder="prompt (enter sends, shift+enter newline)"></textarea>
        <button id="send" type="submit" title="send (enter)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
      </div>
    </form>
  </main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
